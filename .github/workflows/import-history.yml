name: Import original AppImage source history
on:
  push:
    paths: ['.github/workflows/import-history.yml']
permissions:
  contents: write
jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - name: Verify and import original commits
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -eu
          curl --fail --location --retry 3 https://raw.githubusercontent.com/jeparks808/soundcloud-library-manager/${{ github.sha }}/original-history.bundle -o /tmp/original-history.bundle
          git init /tmp/sclm-import
          cd /tmp/sclm-import
          git bundle verify /tmp/original-history.bundle
          git fetch /tmp/original-history.bundle refs/heads/main:refs/heads/appimage-source
          test "$(git rev-parse appimage-source)" = 2177b26c79486c0e10261484c01d8d17d5918adb
          test "$(git rev-list --count appimage-source)" = 8
          git -c credential.helper='!f() { echo username=x-access-token; echo "password=$GH_TOKEN"; }; f' push https://github.com/jeparks808/soundcloud-library-manager.git refs/heads/appimage-source:refs/heads/appimage-source
